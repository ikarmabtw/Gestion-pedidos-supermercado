<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="../js/auth-guard.js"></script>
    <title>Pedidos Ingresados | Gestión de Pedidos</title>
    <link rel="stylesheet" href="../css/styles.css">
</head>
<body data-raiz="../" data-vista="pedidos-ingresados">
    <header id="app-header"></header>

    <main id="contenido" class="contenido-principal">
        <h1 id="titulo-ingresados" tabindex="-1">Pedidos Ingresados</h1>
        <div id="tabla-pedidos-contenedor" class="tabla-pedidos-scroll"></div>
        <p id="ayuda-seleccion" class="ayuda-seleccion" hidden>
            Seleccione un pedido para editar o eliminar
        </p>
        <div class="pedido-acciones">
            <button type="button" id="btn-editar" class="boton boton--azul" disabled>Editar</button>
            <button type="button" id="btn-eliminar" class="boton boton--rojo" disabled>Eliminar</button>
        </div>
    </main>

    <footer id="app-footer"></footer>
    <script src="../js/layout.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/data.js"></script>
    <script src="../js/validaciones.js"></script>
    <script src="../js/modal.js"></script>
    <script src="../js/pedidos-ingresados.js"></script>
</body>
</html>
